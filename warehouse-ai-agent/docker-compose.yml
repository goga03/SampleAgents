version: '3.9'
services:
  backend:
    build: ./backend
    environment:
      - OPENAI_API_KEY=YOUR_OPENAI_API_KEY
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
